name: Deploy

on:
    push:
        branches:
            - main

jobs:
    check:
        runs-on: ubuntu-latest

        services:
            postgres-test:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: finance_app_test
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --include=dev

            - name: Generate Prisma Client
              run: npx prisma generate

            - name: ESLint
              run: npm run eslint:check

            - name: Prettier
              run: npm run prettier:check

            - name: Test
              run: npm run test:ci
              env:
                  NODE_OPTIONS: --experimental-vm-modules
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/finance_app_test
                  JWT_ACCESS_TOKEN_SECRET: test_access_token_secret_for_ci_only
                  JWT_REFRESH_TOKEN_SECRET: test_refresh_token_secret_for_ci_only

    migrate:
        runs-on: ubuntu-latest
        needs: check
        environment: production

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --include=dev

            - name: Generate Prisma Client
              run: npx prisma generate

            - name: Run migrations
              run: npx prisma migrate deploy
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

    deploy:
        runs-on: ubuntu-latest
        needs: migrate
        environment: production

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Deploy to production
              run: |
                  curl "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
              env:
                  JWT_ACCESS_TOKEN_SECRET: ${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
                  JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
