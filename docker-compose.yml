services:
  postgres:
    image: postgres
    container_name: financeapp-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql

  postgres-test:
    image: postgres
    container_name: financeapp-postgres-test
    env_file:
      - .env
      - .env.test
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT_TEST}:5432"
    volumes:
      - ./postgres-test-data:/var/lib/postgresql
